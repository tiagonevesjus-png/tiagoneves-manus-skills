name: Testes

# O motor de prazos é a peça de que tudo depende. Uma alteração que quebre a
# contagem não pode chegar à main sem que alguém veja.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m pytest tests/ -q

      - name: Conferir que a planilha e os filtros ainda são gerados
        run: |
          python tools/gerar_filtros_gmail.py --saida /tmp/filtros.xml
          python -c "
          import xml.etree.ElementTree as ET
          ET.parse('/tmp/filtros.xml')
          print('XML de filtros válido')
          "
